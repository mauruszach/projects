services:
  - type: web
    name: temporal-kg-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    # No ANTHROPIC_API_KEY here: bring-your-own-key by default. Callers of any
    # Claude-backed endpoint supply their own key in the X-Anthropic-Api-Key
    # header (see app/api/deps.py); this service holds no key of its own.
    envVars:
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: GDELT_DATA_DIR
        value: /tmp/gdelt

  - type: cron
    name: temporal-kg-ingest
    env: docker
    dockerfilePath: ./Dockerfile
    schedule: "*/15 * * * *"
    dockerCommand: python scripts/schedule_ingest.py
    envVars:
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: GDELT_DATA_DIR
        value: /tmp/gdelt
