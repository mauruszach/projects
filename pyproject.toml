[project]
name = "temporal-kg-engine"
version = "0.1.0"
description = "Temporal knowledge graph engine for geopolitical event forecasting"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "neo4j>=5.23",
    "anthropic>=0.34",
    "httpx>=0.27",
    "tenacity>=9.0",
    "structlog>=24.4",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
