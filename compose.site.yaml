services:
  site:
    build:
      context: .
      dockerfile: Dockerfile.site
    init: true
    ports:
      - "${SITE_PORT:-3008}:3000"
    environment:
      GDELT_API_URL: "${GDELT_API_URL:-}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
